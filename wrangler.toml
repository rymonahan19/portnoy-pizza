# Cloudflare Pages project config for portnoy.pizza (static site + /data/* function)
name = "portnoy-pizza"
compatibility_date = "2026-08-01"
pages_build_output_dir = "site"

[[kv_namespaces]]
binding = "PSI_DATA"
id = "1b126b76c84a457ba661f12b3ce936ac"            # created 2026-08-16: psi-data

[[d1_databases]]
binding = "PSI_DB"
database_name = "psi"
database_id = "7519813c-f895-4fe7-897f-13cac5ca31fd"   # created 2026-08-16 (ENAM); tables: reviews, blobs, changelog
